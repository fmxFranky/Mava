# --- PMAT Network params ---
n_block: 1 # Transformer blocks
embed_dim: 64 # Transformer embedding dimension
n_head: 1 # Transformer heads
use_rmsnorm: False # Whether to use RMSNorm instead of LayerNorm
use_swiglu: False # Use SwiGLU instead of a 2-layer MLP for the feedforward networks

# --- PMAT-specific params ---
scoring_hidden_dim: 64 # Hidden dimension for the scoring network
scoring_n_layers: 2 # Number of layers in the scoring network
ranking_loss_coef: 1.0 # Coefficient for the ranking loss